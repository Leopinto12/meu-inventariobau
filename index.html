<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Leitor de Excel – Progresso Automático</title>

  <!-- SheetJS -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

  <!-- Firebase (AJUSTE COM SUAS CHAVES) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    body {
      background: #0b0f1a;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 40px;
    }
    button {
      padding: 10px 20px;
      background: #8b5cf6;
      border: none;
      color: #fff;
      cursor: pointer;
      border-radius: 6px;
    }
    input {
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <h2>Importar Excel e Atualizar Progresso</h2>

  <input type="file" id="excelInput" accept=".xlsx,.xls">
  <br>
  <button onclick="processExcel()">Processar Excel</button>

  <script>
    // 🔥 CONFIG FIREBASE (SUBSTITUA)
    const firebaseConfig = {
      apiKey: "SUA_API_KEY",
      authDomain: "SEU_DOMINIO",
      projectId: "SEU_PROJECT_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function processExcel() {
      const file = document.getElementById("excelInput").files[0];
      if (!file) {
        alert("Selecione um arquivo Excel");
        return;
      }

      const reader = new FileReader();

      reader.onload = (e) => {
        const workbook = XLSX.read(e.target.result, { type: "array" });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });

        let total = 0;
        let classificados = 0;
        let pendentes = 0;

        for (let i = 1; i < rows.length; i++) {
          const row = rows[i];
          if (!row[0]) continue; // ignora linha vazia

          total++;

          const colC = row[2]; // classificação
          const colD = row[3];
          const colE = row[4];

          if (colC || colD || colE) {
            classificados++;
          } else {
            pendentes++;
          }
        }

        const progresso = total === 0 ? 0 : Math.round((classificados / total) * 100);

        console.log({ total, classificados, pendentes, progresso });

        atualizarFirebase(total, pendentes, progresso);
      };

      reader.readAsArrayBuffer(file);
    }

    function atualizarFirebase(total, pendentes, progresso) {
      db.collection("trees")
        .doc("AGUAS_CLARAS") // MUDE O ID DA ÁRVORE
        .set({
          total: total,
          pending: pendentes,
          progress: progresso,
          updatedAt: new Date()
        }, { merge: true })
        .then(() => {
          alert("🔥 Progresso atualizado com sucesso!");
        })
        .catch(err => {
          console.error(err);
          alert("Erro ao atualizar Firebase");
        });
    }
  </script>

</body>
</html>
